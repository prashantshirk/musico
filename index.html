<html lang="en">
  <head>

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         non-zero values on notched devices. Without it the pt-safe/pb-safe
         utilities resolve to 0 and the player chrome sits under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description" content="Musico - built by prashant" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Musico" />
    <meta property="og:description" content="Musico - built by prashant" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  </head>
